<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17242b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Reset password — RecruitO</title>
  <link rel="stylesheet" href="./styles.css?v=20261026-6">
  <script src="./js/config.js?v=20261015-2" defer></script>
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card" aria-labelledby="reset-heading">
      <a class="brand auth-brand" href="./index.html" aria-label="RecruitO home">
        <img class="brand-mark" src="./assets/recruito-logo.png" alt="">
        <span class="brand-copy"><strong>RecruitO</strong><span>Recruitment platform</span></span>
      </a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="reset-heading">Set a new password</h1>
      <p class="auth-copy">Choose a new password for your RecruitO account.</p>
      <div id="reset-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
      <form id="reset-form">
        <div class="form-field">
          <label for="reset-password">New password (8+ characters)</label>
          <input id="reset-password" name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label for="reset-confirm">Confirm new password</label>
          <input id="reset-confirm" name="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <button id="reset-button" class="button button-primary auth-submit" type="submit">Reset password</button>
      </form>
      <a id="reset-signin-link" class="text-button" href="./index.html?auth=signin">Back to sign in</a>
    </section>
  </main>
  <script type="module" src="./js/reset-password.js?v=20261028-6"></script>
</body>
</html>
