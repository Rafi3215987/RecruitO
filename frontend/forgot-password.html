<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17242b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Forgot password — RecruitO</title>
  <link rel="stylesheet" href="./styles.css?v=20261026-6">
  <script src="./js/config.js?v=20261015-2" defer></script>
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card" aria-labelledby="forgot-heading">
      <a class="brand auth-brand" href="./index.html" aria-label="RecruitO home">
        <img class="brand-mark" src="./assets/recruito-logo.png" alt="">
        <span class="brand-copy"><strong>RecruitO</strong><span>Recruitment platform</span></span>
      </a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="forgot-heading">Forgot your password?</h1>
      <p class="auth-copy">Enter the email on your account. If it exists, we'll send a link to reset your password. The link expires in 1 hour.</p>
      <div id="forgot-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
      <form id="forgot-form">
        <div class="form-field">
          <label for="forgot-email">Email address</label>
          <input id="forgot-email" name="email" type="email" maxlength="255" autocomplete="email" required>
        </div>
        <button id="forgot-button" class="button button-primary auth-submit" type="submit">Send reset link</button>
      </form>
      <a class="text-button" href="./index.html?auth=signin">Back to sign in</a>
    </section>
  </main>
  <script type="module" src="./js/forgot-password.js?v=20261027-1"></script>
</body>
</html>
