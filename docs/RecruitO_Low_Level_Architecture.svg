<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title description">
  <title id="title">RecruitO low-level architecture</title>
  <desc id="description">Architecture diagram showing RecruitO users, Nginx frontend, FastAPI APIs and workers, LangGraph workflows, supporting services, PostgreSQL and file storage, external integrations, and Docker Compose deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#365578"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #50627a; }
      .lane-label { font-size: 17px; font-weight: 700; }
      .card-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; fill: #33465f; }
      .small { font-size: 12px; fill: #50627a; }
      .note { font-size: 12px; fill: #596b80; }
      .card { fill: #fff; stroke: #b7c8db; stroke-width: 1.4; }
      .connector { fill: none; stroke: #365578; stroke-width: 2; marker-end: url(#arrow); }
      .connector-dashed { fill: none; stroke: #647d99; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .flow-label { font-size: 11px; fill: #405775; }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#f5f8fc"/>
  <text x="900" y="43" text-anchor="middle" class="title">RecruitO — Low-Level Architecture</text>
  <text x="900" y="68" text-anchor="middle" class="subtitle">Candidate recruitment, privacy-scoped chatbot, interviews, and evidence-based assessment</text>

  <rect x="28" y="90" width="1744" height="140" rx="14" fill="#eef2ff" stroke="#a9b5e8" stroke-width="1.5"/>
  <text x="48" y="116" class="lane-label" fill="#3f4b91">1 · Users and browser clients</text>
  <rect x="48" y="130" width="540" height="82" rx="10" class="card"/>
  <text x="68" y="154" class="card-title">Hiring manager</text>
  <text x="68" y="176" class="body">Jobs and requirements · applications and rankings · interview scheduling</text>
  <text x="68" y="196" class="body">Assessment reports · role-scoped assistant</text>
  <rect x="630" y="130" width="540" height="82" rx="10" class="card"/>
  <text x="650" y="154" class="card-title">Interviewer</text>
  <text x="650" y="176" class="body">Assigned interviews · interview room · live transcript</text>
  <text x="650" y="196" class="body">Interview analysis and role-scoped assistant</text>
  <rect x="1212" y="130" width="540" height="82" rx="10" class="card"/>
  <text x="1232" y="154" class="card-title">Candidate</text>
  <text x="1232" y="176" class="body">Public jobs · application and CV upload · application status</text>
  <text x="1232" y="196" class="body">Interview room · candidate assistant (own data and public jobs)</text>

  <path d="M900 230 V250" class="connector"/>
  <text x="913" y="244" class="flow-label">Browser over HTTPS</text>

  <rect x="28" y="252" width="1744" height="150" rx="14" fill="#e9f6ff" stroke="#83b9df" stroke-width="1.5"/>
  <text x="48" y="278" class="lane-label" fill="#1e5c83">2 · Frontend container — Nginx serves static HTML, CSS, and JavaScript</text>
  <rect x="48" y="292" width="520" height="92" rx="10" class="card"/>
  <text x="68" y="317" class="card-title">RecruitO web application</text>
  <text x="68" y="339" class="body">Candidate, manager, and interviewer pages</text>
  <text x="68" y="360" class="body">JavaScript modules call same-origin API at /api</text>
  <rect x="590" y="292" width="520" height="92" rx="10" class="card"/>
  <text x="610" y="317" class="card-title">Role-aware chat interface</text>
  <text x="610" y="339" class="body">Candidate assistant is limited to signed-in candidate data</text>
  <text x="610" y="360" class="body">Staff assistant uses role- and user-scoped tools</text>
  <rect x="1132" y="292" width="620" height="92" rx="10" class="card"/>
  <text x="1152" y="317" class="card-title">Interview room — meeting-room.js</text>
  <text x="1152" y="339" class="body">getUserMedia · LiveKit client or WebRTC peer media · room controls</text>
  <text x="1152" y="360" class="body">Optional consented MediaRecorder chunks · transcript WebSocket</text>

  <path d="M900 402 V422" class="connector"/>
  <text x="913" y="416" class="flow-label">/api REST + WebSockets (Nginx reverse proxy)</text>

  <rect x="28" y="424" width="1744" height="188" rx="14" fill="#fff0ef" stroke="#e59b94" stroke-width="1.5"/>
  <text x="48" y="450" class="lane-label" fill="#8b3732">3 · Backend container — FastAPI (app.main), Pydantic schemas, SQLAlchemy</text>
  <rect x="48" y="464" width="405" height="126" rx="10" class="card"/>
  <text x="68" y="489" class="card-title">Authentication and access control</text>
  <text x="68" y="513" class="body">JWT-backed session; role dependencies</text>
  <text x="68" y="534" class="body">Candidate, interviewer, manager scoping</text>
  <text x="68" y="555" class="body">Auth, profiles, staff, audit-related routes</text>
  <rect x="475" y="464" width="405" height="126" rx="10" class="card"/>
  <text x="495" y="489" class="card-title">Jobs and applications APIs</text>
  <text x="495" y="513" class="body">Job creation, requirements, public jobs</text>
  <text x="495" y="534" class="body">Application intake, CV upload, status</text>
  <text x="495" y="555" class="body">Screening, ranking, manager actions</text>
  <rect x="902" y="464" width="405" height="126" rx="10" class="card"/>
  <text x="922" y="489" class="card-title">Interviews and chat APIs</text>
  <text x="922" y="513" class="body">Scheduling, role-scoped room access</text>
  <text x="922" y="534" class="body">Signal, transcript, and optional identity sockets</text>
  <text x="922" y="555" class="body">Candidate and role-aware chat endpoints</text>
  <rect x="1329" y="464" width="423" height="126" rx="10" class="card"/>
  <text x="1349" y="489" class="card-title">Background worker loop</text>
  <text x="1349" y="513" class="body">Notification and screening queues</text>
  <text x="1349" y="534" class="body">Interview analysis and scheduling queues</text>
  <text x="1349" y="555" class="body">No-show handling · biometric expiry cleanup</text>

  <path d="M900 612 V632" class="connector"/>
  <text x="913" y="626" class="flow-label">APIs invoke workflows and domain services</text>

  <rect x="28" y="634" width="1744" height="264" rx="14" fill="#fff7df" stroke="#dfc36e" stroke-width="1.5"/>
  <text x="48" y="660" class="lane-label" fill="#795b17">4 · Workflow orchestration and domain services</text>
  <rect x="48" y="674" width="405" height="204" rx="10" fill="#f1fbf3" stroke="#93c9a0" stroke-width="1.3"/>
  <text x="68" y="700" class="card-title">CV screening and ranking</text>
  <text x="68" y="724" class="body">Load application, CV, and job requirements</text>
  <text x="68" y="745" class="body">Extract PDF/DOCX text; evaluate and validate</text>
  <text x="68" y="766" class="body">Retry invalid model output (bounded attempts)</text>
  <text x="68" y="787" class="body">Persist score, evidence, and status</text>
  <text x="68" y="820" class="small">cv_screening_graph · application_ranking_graph</text>
  <rect x="475" y="674" width="405" height="204" rx="10" fill="#f4f0ff" stroke="#b3a0dc" stroke-width="1.3"/>
  <text x="495" y="700" class="card-title">Candidate assistant and role chatbot</text>
  <text x="495" y="724" class="body">Retrieve only signed-in candidate's own applications</text>
  <text x="495" y="745" class="body">Add approved public job posts as permitted context</text>
  <text x="495" y="766" class="body">Staff tools are separately bound to role and user</text>
  <text x="495" y="787" class="body">Generate grounded responses; no hiring decisions</text>
  <text x="495" y="820" class="small">candidate_chatbot · role_chatbot · Gemini</text>
  <rect x="902" y="674" width="405" height="204" rx="10" fill="#f4f0ff" stroke="#b3a0dc" stroke-width="1.3"/>
  <text x="922" y="700" class="card-title">Interview analysis and assessment</text>
  <text x="922" y="724" class="body">Load transcript, candidate CV, and job requirements</text>
  <text x="922" y="745" class="body">Structure Q&amp;A; map answers to requirements</text>
  <text x="922" y="766" class="body">Evaluate and validate evidence references</text>
  <text x="922" y="787" class="body">Persist analysis for consolidated reports</text>
  <text x="922" y="820" class="small">interview_analysis_graph · assessment services</text>
  <rect x="1329" y="674" width="423" height="204" rx="10" fill="#fff" stroke="#c3ad70" stroke-width="1.3"/>
  <text x="1349" y="700" class="card-title">Supporting domain services</text>
  <text x="1349" y="724" class="body">JD drafting and policy checks (LangGraph)</text>
  <text x="1349" y="745" class="body">Audio transcription and transcript persistence</text>
  <text x="1349" y="766" class="body">Email notifications and durable outbox queues</text>
  <text x="1349" y="787" class="body">LiveKit token minting; optional face verification</text>
  <text x="1349" y="820" class="small">policy · screening · interview · notification services</text>

  <path d="M900 898 V918" class="connector"/>
  <text x="913" y="912" class="flow-label">SQLAlchemy persistence · file-volume access</text>

  <rect x="28" y="920" width="1744" height="150" rx="14" fill="#f2edff" stroke="#b39bdc" stroke-width="1.5"/>
  <text x="48" y="946" class="lane-label" fill="#574184">5 · Data and file storage</text>
  <rect x="48" y="960" width="790" height="92" rx="10" class="card"/>
  <text x="68" y="985" class="card-title">PostgreSQL (pgvector image) — relational application data</text>
  <text x="68" y="1008" class="body">Users and roles · jobs and requirements · applications and scores · interviews and consent</text>
  <text x="68" y="1030" class="body">Transcript segments · assessments · notifications/outbox · audit records</text>
  <rect x="860" y="960" width="460" height="92" rx="10" class="card"/>
  <text x="880" y="985" class="card-title">Persistent candidate uploads</text>
  <text x="880" y="1008" class="body">CV/resume files in candidate_uploads volume</text>
  <text x="880" y="1030" class="body">Metadata and references stored in PostgreSQL</text>
  <rect x="1342" y="960" width="410" height="92" rx="10" class="card"/>
  <text x="1362" y="985" class="card-title">Staff photos and face models</text>
  <text x="1362" y="1008" class="body">staff_photos volume; pinned models in API image</text>
  <text x="1362" y="1030" class="body">Biometric retention cleanup is scheduled</text>

  <text x="900" y="1085" text-anchor="middle" class="flow-label">Backend domain services call configured integrations over the network</text>

  <rect x="28" y="1092" width="1744" height="134" rx="14" fill="#eaf7ed" stroke="#91c5a0" stroke-width="1.5"/>
  <text x="48" y="1118" class="lane-label" fill="#2c6940">6 · External services and media transport</text>
  <rect x="48" y="1132" width="318" height="76" rx="10" class="card"/>
  <text x="68" y="1158" class="card-title">Google Gemini</text>
  <text x="68" y="1182" class="body">JD · CV scoring · chat · analysis</text>
  <rect x="384" y="1132" width="318" height="76" rx="10" class="card"/>
  <text x="404" y="1158" class="card-title">AssemblyAI</text>
  <text x="404" y="1182" class="body">Audio chunk upload and transcription</text>
  <rect x="720" y="1132" width="318" height="76" rx="10" class="card"/>
  <text x="740" y="1158" class="card-title">LiveKit / WebRTC</text>
  <text x="740" y="1182" class="body">Optional LiveKit; WebRTC fallback</text>
  <rect x="1056" y="1132" width="318" height="76" rx="10" class="card"/>
  <text x="1076" y="1158" class="card-title">SMTP provider</text>
  <text x="1076" y="1182" class="body">Invitations and status notifications</text>
  <rect x="1392" y="1132" width="360" height="76" rx="10" class="card"/>
  <text x="1412" y="1158" class="card-title">Blogger / Mail2Blogger</text>
  <text x="1412" y="1182" class="body">Approval-triggered job publishing via MCP</text>

  <rect x="28" y="1242" width="1744" height="54" rx="12" fill="#e9f3ff" stroke="#9bbbe0" stroke-width="1.3"/>
  <text x="48" y="1265" class="card-title">Docker Compose deployment</text>
  <text x="288" y="1265" class="body">frontend (Nginx) · api (FastAPI + worker loop) · db · blogger-mcp · optional cloudflared tunnel</text>
  <text x="48" y="1285" class="note">Named volumes: pgdata · candidate_uploads · staff_photos   |   TURN relay is not configured; direct WebRTC connectivity can depend on network conditions.</text>
</svg>
